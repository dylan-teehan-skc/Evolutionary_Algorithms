algorithm: gp # ga or gp
seed: 42 # same seed + same config = same run
runs: 30 # experiment.py runs seeds seed, seed+1, ..., seed+runs-1
problem: nguyen-1 # GP benchmark: nguyen-1, nguyen-2, nguyen-5, nguyen-7

initialisation:
  bitstrings:
    length: 100
  trees:
    max_tree_depth: 4

selection:
  method: tournament # tournament or roulette
  tournament:
    tournament_size: 3

evolution:
  population_size: 500
  generations: 50
  crossover_rate: 0.9
  mutation_rate: 0.05
  elites: 1

success: # a run that meets this stops early and counts as a success
  ga: 100 # best fitness reaches this (OneMax: all bits 1)
  gp: 0.01 # every point's absolute error is below this, the "hit" rule of Uy et al. (2011)
