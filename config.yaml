algorithm: gp # ga or gp
seed: 42 # same seed + same config = same run
runs: 30 # experiment.py runs seeds seed, seed+1, ..., seed+runs-1

initialisation:
  bitstrings:
    length: 100
  trees:
    max_tree_depth: 4

selection:
  method: tournament # tournament or roulette
  tournament:
    tournament_size: 3

evolution:
  population_size: 500
  generations: 50
  crossover_rate: 0.9
  mutation_rate: 0.05
  elites: 1

target_fitness:
  ga: 100
  gp: 0

points:
  - [-5, 520]
  - [-4, 204]
  - [-3, 60]
  - [-2, 10]
  - [-1, 0]
  - [0, 0]
  - [1, 4]
  - [2, 30]
  - [3, 120]
  - [4, 340]
  - [5, 780]
