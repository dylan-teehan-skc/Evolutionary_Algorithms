seed: 42 # same seed + same config = same run
runs: 30 # experiment.py runs seeds seed, seed+1, ..., seed+runs-1
length: 100 # bits per individual

selection:
  method: tournament # tournament or roulette
  tournament:
    tournament_size: 3

evolution:
  population_size: 500
  generations: 50
  crossover_rate: 0.9
  mutation_rate: 0.05
  elites: 1

success: 100 # a run stops early and counts as a success once best fitness reaches this (OneMax: all bits 1)
